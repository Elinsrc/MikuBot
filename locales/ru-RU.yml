welcome_format_help_msg: "Сообщение может быть отформатировано в формате html или с помощью встроенного текстового форматера Telegram. Вы можете использовать команду /html, чтобы проверить правильность вашего html-кода.\n\nВы можете использовать эти аргументы для приветственного сообщения:\n - <code>{id}</code> для отображения идентификатора пользователя в приветственном сообщении.\n - <code>{username}</code> для отображения имени пользователя в приветственном сообщении. если у пользователя нет имени пользователя, бот показывает упоминание.\n - <code>{first_name}</code> для отображения имени пользователя в приветственном сообщении\n - <code>{full_name}</code> или <code>{name}</code> для отображения полного имени пользователя в приветственном сообщении.\n - <code>{mention}</code> упомянуть пользователя в приветственном сообщении.\n - <code>{chat_title}</code> или <code>{title}</code> чтобы показать название чата в приветственном сообщении.\n - <code>{count}</code> чтобы показать количество участников чата в приветственном сообщении.\n\nДля добавления кнопок вы можете использовать <code>[button text](buttonurl:button link)</code>. TЧтобы добавить больше кнопок в ту же строку, вы можете добавить :same после ссылки, вот так: <code>[button text](buttonurl:button link:same)</code>."
